name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: ['*']
  repository_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup-ci'

      - name: Typecheck
        run: pnpm run check
  lint:
    runs-on: ubuntu-latest
    name: Linter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup-ci'

      - name: Run linter
        run: pnpm run lint
  unit-tests:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup-ci'

      - name: Run Tests
        run: pnpm run test
